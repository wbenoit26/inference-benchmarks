[project]
name = "inference-benchmarks"
version = "0.0.1"
description = "Benchmarks of aframe's inference across backends and sites"
requires-python = ">=3.12"
dependencies = ["numpy", "h5py"]

[dependency-groups]
dev = [
    "pytest",
    "prek>=0.1",
]

[tool.ruff]
line-length = 79
target-version = "py312"

[tool.ruff.lint]
extend-safe-fixes = ["C408"]
mccabe = {"max-complexity" = 18}
select = ["B", "C", "E", "F", "I", "UP", "W"]
# ignore W605 and E203 for consistency with black
ignore = ["W605", "E203"]  

[tool.pytest.ini_options]
pythonpath = ["."]
